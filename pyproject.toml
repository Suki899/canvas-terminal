[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-terminal"
version = "0.2.0"
description = "Your Canvas LMS courses from the terminal: deadlines, announcements, pages, quizzes, file sync, submissions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["requests>=2.32.4,<3", "urllib3>=1.26,<3"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
canvas = "canvas_cli.cli:main"

[tool.setuptools]
packages = ["canvas_cli"]
